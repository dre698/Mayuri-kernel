# ==============================================================================
# PROJECT: VoidLine Kernel Rebirth
# TARGET DEVICE: Blossom (Redmi 9C/9A)
# VERSION: Vanilla Edition + KernelSU + MultiSU (Automated)
# AUTHOR: LineXin Development Team
# ==============================================================================

name: VoidLine Kernel Rebirth ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom
  ZIP_NAME: "VoidLine_Kernel_Rebirth-MultiSU_blossom.zip"
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    name: Industrial Kernel Build
    runs-on: ubuntu-22.04

    steps:
      - name: 1.0 [PRE-BUILD] Initializing Workspace
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: 2.0 [DEPS] Installing Toolchains
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache patch curl
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: 3.0 [PATCHING] KernelSU & MultiSU Integration
        run: |
         
          # ИНТЕГРАЦИЯ MultiSU
          echo "Запуск скрипта MultiSU..."
          curl -LSs "https://raw.githubusercontent.com/xxblebleblexx/MultiSU/refs/heads/legacy/kernel/setup.sh" | bash -s legacy -[cite: 1]

      - name: 4.0 [CONFIG] Generating & Fixing Config
        run: |
          mkdir -p out
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          # Генерируем базу
          make O=out ${DEFCONFIG}_defconfig[cite: 1]
          
          # КРИТИЧЕСКИЙ ФИКС: Авто-принятие новых опций от MultiSU/KSU
          # Это предотвращает ошибку "End of file" в автоматической среде
          make O=out ARCH=arm64 olddefconfig[cite: 1]
          
          # Твик варнингов
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=8192/g' out/.config

      - name: 5.0 [BUILD] Compiling VoidLine Kernel
        run: |
          START_TIME=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          set -o pipefail
          echo "Запуск компиляции..."
          
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            LOCALVERSION="VKR-ksu_blossom" \
            KBUILD_WERROR=0 \
            KCFLAGS="-Wno-unknown-warning-option" 2>&1 | tee build.log[cite: 1]
            
          echo "B_TIME=$(($(date +%s) - $START_TIME))" >> $GITHUB_ENV
        continue-on-error: false

      - name: 6.0 [PACKAGE] AnyKernel3 Deployment
        if: success()
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -z "$IMAGE" ]; then exit 1; fi
          
          git clone --depth=1 https://github.com/LineXin/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          cd ak3
          zip -r9 ../${{ env.ZIP_NAME }} * -x .git* README.md
          cd ..
          echo "Z_MD5=$(md5sum ${{ env.ZIP_NAME }} | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: 7.0 [REPORT] Success/Failure Telegram
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            CAPTION="✅ *VoidLine MultiSU Success!*%0A⏱ *Время:* ${{ env.B_TIME }}s%0A🔐 *MD5:* \`${{ env.Z_MD5 }}\`"
            curl -s -F chat_id="$CHAT_ID" -F document=@${{ env.ZIP_NAME }} \
              -F caption="$CAPTION" -F parse_mode=Markdown \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            [ -f build.log ] && curl -s -F chat_id="$CHAT_ID" -F document=@build.log \
              -F caption="❌ *Build Failed!* Анализируй лог." \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi
