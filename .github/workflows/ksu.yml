# ==============================================================================
# PROJECT: VoidLine Kernel Rebirth
# TARGET DEVICE: Blossom (Redmi 9C/9A)
# VERSION: Vanilla Edition + MultiSU (Automated)
# AUTHOR: LineXin Development Team
# ==============================================================================

name: VoidLine Kernel Rebirth ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom
  ZIP_NAME: "VoidLine_Kernel_Rebirth-ksu_blossom.zip"
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    name: Industrial Kernel Build
    runs-on: ubuntu-22.04

    steps:
      - name: 1.0 [PRE-BUILD] Initializing Workspace
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: 2.0 [DEPS] Installing Toolchains
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache patch curl
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: 3.0 [PATCHING] MultiSU Integration
        run: |
          echo "Запуск скрипта MultiSU..."
          curl -LSs "https://raw.githubusercontent.com/xxblebleblexx/MultiSU/refs/heads/legacy/kernel/setup.sh" | bash -s legacy -

      - name: 4.0 [CONFIG] Generating & Fixing Config
        run: |
          mkdir -p out
          # Убираем все экспорты и передаем аргументы напрямую в make
          # Это лечит "multiple target patterns" на 148 строке[cite: 1]
          make O=out ARCH=arm64 \
               CROSS_COMPILE=$PWD/gcc64/bin/aarch64-linux-android- \
               CROSS_COMPILE_ARM32=$PWD/gcc/bin/arm-linux-androideabi- \
               ${DEFCONFIG}_defconfig[cite: 1]
          
          # Авто-принятие новых конфигов от MultiSU[cite: 1]
          make O=out ARCH=arm64 \
               CROSS_COMPILE=$PWD/gcc64/bin/aarch64-linux-android- \
               CROSS_COMPILE_ARM32=$PWD/gcc/bin/arm-linux-androideabi- \
               olddefconfig[cite: 1]
          
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=8192/g' out/.config

      - name: 5.0 [BUILD] Compiling VoidLine Kernel
        run: |
          START_TIME=$(date +%s)
          # Добавляем clang в PATH только для этого шага
          export PATH="$PWD/clang/bin:$PATH"
          
          set -o pipefail
          echo "Запуск компиляции..."
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$PWD/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$PWD/gcc/bin/arm-linux-androideabi- \
            LOCALVERSION="VKR-ksu_blossom" \
            KBUILD_WERROR=0 \
            KCFLAGS="-Wno-unknown-warning-option" 2>&1 | tee build.log[cite: 1]
            
          echo "B_TIME=$(($(date +%s) - $START_TIME))" >> $GITHUB_ENV
        continue-on-error: false

      - name: 6.0 [PACKAGE] AnyKernel3 Deployment
        if: success()
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -z "$IMAGE" ]; then exit 1; fi
          
          git clone --depth=1 https://github.com/LineXin/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          cd ak3
          zip -r9 ../${{ env.ZIP_NAME }} * -x .git* README.md
          cd ..
          echo "Z_MD5=$(md5sum ${{ env.ZIP_NAME }} | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: 7.0 [REPORT] Telegram Reporting
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            CAPTION="✅ *VoidLine MultiSU Success!*%0A⏱ *Время:* ${{ env.B_TIME }}s%0A🔐 *MD5:* \`${{ env.Z_MD5 }}\`"
            curl -s -F chat_id="$CHAT_ID" -F document=@${{ env.ZIP_NAME }} \
              -F caption="$CAPTION" -F parse_mode=Markdown \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            # Отправляем лог только если он существует[cite: 1]
            if [ -f build.log ]; then
              curl -s -F chat_id="$CHAT_ID" -F document=@build.log \
                -F caption="❌ *Build Failed!* См. лог." \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            else
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                -d "chat_id=$CHAT_ID" -d "text=❌ *Critical Failure!* Ошибка до начала компиляции."
            fi
          fi
