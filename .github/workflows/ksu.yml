# ==============================================================================
# PROJECT: VoidLine Kernel Rebirth
# TARGET DEVICE: Blossom (Redmi 9C non-NFC)
# VERSION: Vanilla Edition + MultiSU (Debug Mode)
# ==============================================================================

name: VoidLine Kernel Rebirth ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom
  ZIP_NAME: "VoidLine_Kernel_Rebirth-ksu_blossom.zip"
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    name: Industrial Kernel Build
    runs-on: ubuntu-22.04

    steps:
      - name: 1.0 [PRE-BUILD] Initializing Workspace
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: 1.1 [TG] Notify Build Started
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="🚀 *VoidLine Rebirth:* Попытка сборки с MultiSU...%0A🔧 *Логирование:* Расширенное" \
            -d parse_mode=Markdown

      - name: 2.0 [DEPS] Installing Toolchains
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache patch curl
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: 3.0 [PATCHING] Safe Makefile Repair
        run: |
          # ФИКС: Добавлены пробелы перед '+' в командах find
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror[^[:space:])]*//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wimplicit-function-declaration//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wreturn-type//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wunused-variable//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wunused-function//g' {} +

      - name: 4.0 [MultiSU] Automated Setup with Log
        run: |
          set -e
          echo "🚀 Интеграция MultiSU (legacy branch)..."
          curl -LSs "https://raw.githubusercontent.com/xxblebleblexx/MultiSU/refs/heads/legacy/kernel/setup.sh" | bash -s legacy | tee multisu_setup.log

      - name: 5.0 [CONFIG] Generating & Verifying Config
        run: |
          set -e
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          make O=out ${DEFCONFIG}_defconfig
          
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_KPROBES=y"
          } >> out/.config
          
          sed -i 's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/g' out/.config
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=2048/g' out/.config
          
          make O=out olddefconfig

      - name: 6.0 [BUILD] Compiling VoidLine Kernel
        run: |
          set -e
          set -o pipefail
          START_TIME=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            LOCALVERSION="VKR-ksu_blossom" \
            KBUILD_WERROR=0 \
            2>&1 | tee build.log
            
          echo "B_TIME=$(($(date +%s) - START_TIME))" >> $GITHUB_ENV

      - name: 7.0 [PACKAGE] AnyKernel3 Deployment
        if: success()
        run: |
          set -e
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -z "$IMAGE" ]; then exit 1; fi
          
          git clone --depth=1 https://github.com/LineXin/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          cd ak3
          zip -r9 ../${{ env.ZIP_NAME }} * -x .git* README.md
          cd ..
          echo "Z_MD5=$(md5sum ${{ env.ZIP_NAME }} | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: 8.0 [REPORT] Telegram Final Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            CAPTION="✅ *VoidLine Ready!*%0A⏱ *Время:* ${{ env.B_TIME }}s%0A📦 *MD5:* \`${{ env.Z_MD5 }}\`"
            curl -s -F chat_id="$CHAT_ID" -F document=@${{ env.ZIP_NAME }} \
              -F caption="$CAPTION" -F parse_mode=Markdown \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            curl -s -F chat_id="$CHAT_ID" -F document=@build.log \
              -F caption="❌ *Build Failed!* Ошибка синтаксиса в 3.0 исправлена, чекни лог компиляции." \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            
            [ -f multisu_setup.log ] && curl -s -F chat_id="$CHAT_ID" -F document=@multisu_setup.log \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi
