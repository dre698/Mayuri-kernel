name: VoidLine Kernel Rebirth ksu blossom

on:
  push:
    branches: [ perf ]
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom
  ZIP_NAME: "VoidLine_MultiSU_Blossom.zip"
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1.0 Подготовка
        uses: actions/checkout@v3

      - name: 1.1 [TG] Старт
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
          -d chat_id="$CHAT_ID" -d text="🚀 Сборка VoidLine (MultiSU) запущена!"

      - name: 2.0 Тулчейны
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev lld llvm gcc g++ python2 zip curl
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: 3.0 Глобальный фикс варнингов
        run: |
          # Вырезаем -Werror под корень, чтобы сборка не падала из-за пустяков
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wimplicit-function-declaration//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wfatal-errors//g' {} +

      - name: 4.0 [MultiSU] Интеграция
        run: |
          # Чистим перед установкой
          rm -rf drivers/kernelsu
          # Твой запрос: ставим MultiSU Legacy
          curl -LSs "https://raw.githubusercontent.com/xxblebleblexx/MultiSU/refs/heads/legacy/kernel/setup.sh" | bash -s legacy
          
          # Проверяем, что скрипт не забыл добавить папку в билд
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile

      - name: 5.0 Конфиг
        run: |
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          make O=out ARCH=arm64 ${DEFCONFIG}_defconfig
          
          # Силовое включение нужных модулей
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_KPROBES=y"
          } >> out/.config
          
          make O=out ARCH=arm64 olddefconfig

      - name: 6.0 Сборка
        run: |
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KBUILD_WERROR=0 2>&1 | tee build.log

      - name: 7.0 Упаковка и Отправка
        if: always()
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -f "$IMAGE" ]; then
            git clone --depth=1 https://github.com/LineXin/AnyKernel3_blossom ak3
            cp "$IMAGE" ak3/Image.gz
            cd ak3 && zip -r9 ../$ZIP_NAME * && cd ..
            curl -F chat_id="$CHAT_ID" -F document=@$ZIP_NAME -F caption="✅ Готово!" "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            curl -F chat_id="$CHAT_ID" -F document=@build.log -F caption="❌ Ошибка сборки. Чекни лог!" "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi
