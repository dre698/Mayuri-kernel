# ==============================================================================
# PROJECT: VoidLine Kernel Rebirth
# TARGET DEVICE: Blossom (Redmi 9C/9A)
# VERSION: Vanilla Edition + KernelSU (Jonje r-oss AUTO-PATH)
# AUTHOR: LineXin Development Team
# ==============================================================================

name: VoidLine Kernel Rebirth ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom
  ZIP_NAME: "VoidLine_Kernel_Rebirth-ksu-blossom.zip"
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    name: Industrial Kernel Build
    runs-on: ubuntu-22.04

    steps:
      - name: 1.0 [PRE-BUILD] Initializing Workspace
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: 2.0 [DEPS] Installing Toolchains
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache patch curl
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: 3.0 [PATCHING] Safe Makefile Repair
        run: |
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror[^[:space:])]*//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wimplicit-function-declaration//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wreturn-type//g' {} +

      - name: 4.0 [KSU] Applying Jonje Patches (Smart Search)
        run: |
          # 1. Установка KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # 2. Клонируем патчи Jonje ветки r-oss
          git clone https://github.com/jonjeexe/KsuPatch.git -b r-oss KsuPatchRepo
          
          # 3. УМНЫЙ ПОИСК ПАТЧА
          # Ищем любой файл с расширением .patch в склонированной папке
          REAL_PATCH=$(find KsuPatchRepo -name "*.patch" | head -n 1)
          
          if [ -f "$REAL_PATCH" ]; then
            echo "Нашел патч по пути: $REAL_PATCH"
            patch -p1 < "$REAL_PATCH"
          else
            echo "ОШИБКА: Файл патча не найден в репозитории Jonje!"
            exit 1
          fi
          
          # 4. Проверка прописки в драйверах
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile

      - name: 5.0 [CONFIG] Generating Kernel Config
        run: |
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          make O=out ${DEFCONFIG}_defconfig
          
          # Активируем нужные флаги
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "CONFIG_OVERLAY_FS=y" >> out/.config
          echo "CONFIG_KPROBES=y" >> out/.config
          
          # Для KernelSU Next и старых ядер лучше отключить это
          sed -i 's/CONFIG_MODULE_SIG=y/CONFIG_MODULE_SIG=n/g' out/.config
          
          # Применяем изменения
          make O=out olddefconfig

      - name: 6.0 [BUILD] Compiling VoidLine Kernel
        run: |
          START_TIME=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          set -o pipefail
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            LOCALVERSION="VKR-ksu_blossom" \
            KBUILD_WERROR=0 2>&1 | tee build.log
            
          echo "B_TIME=$(($(date +%s) - START_TIME))" >> $GITHUB_ENV

      - name: 7.0 [PACKAGE] AnyKernel3 Deployment
        if: success()
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          git clone --depth=1 https://github.com/LineXin/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          cd ak3
          zip -r9 ../${{ env.ZIP_NAME }} * -x .git* README.md
          cd ..

      - name: 8.0 [REPORT] Telegram Upload
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            CAPTION="✅ *Build Successful!*%0A⏱ *Время:* ${{ env.B_TIME }}s"
            curl -s -F chat_id="$CHAT_ID" -F document=@${{ env.ZIP_NAME }} \
              -F caption="$CAPTION" -F parse_mode=Markdown \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            curl -s -F chat_id="$CHAT_ID" -F document=@build.log \
              -F caption="❌ *Build Failed!* Опять патчи или конфиг." \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi
