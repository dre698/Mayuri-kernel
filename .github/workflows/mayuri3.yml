name: Mayuri Kernel Production CI (Stable)

on:
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: blossom_defconfig
  KERNEL_ARCH: arm64
  KBUILD_BUILD_USER: dre698
  KBUILD_BUILD_HOST: github-actions

  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
  GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # =========================
    # Checkout (SAFE)
    # =========================
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # =========================
    # Dependencies
    # =========================
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex build-essential git zip curl wget \
          cpio kmod libssl-dev libelf-dev ccache python3

    # =========================
    # Clang (retry safe)
    # =========================
    - name: Clang toolchain
      run: |
        for i in 1 2 3; do
          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r428724.git \
            /tmp/clang && break || sleep 3
        done

    # =========================
    # ENV FIX (IMPORTANT)
    # =========================
    - name: Setup env
      run: |
        echo "ARCH=${KERNEL_ARCH}" >> $GITHUB_ENV
        echo "SUBARCH=${KERNEL_ARCH}" >> $GITHUB_ENV

        echo "PATH=/tmp/clang/bin:$PATH" >> $GITHUB_ENV

        # IMPORTANT FIX: remove broken gcc requirement
        echo "CROSS_COMPILE=" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=" >> $GITHUB_ENV

        echo "CC=clang" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    # =========================
    # Clean
    # =========================
    - name: Clean
      run: make mrproper || true

    # =========================
    # Configure (non-interactive FIX)
    # =========================
    - name: Configure kernel
      run: |
        mkdir -p out

        yes "" | make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG} || true
        yes "" | make O=out ARCH=${ARCH} olddefconfig

    # =========================
    # KernelSU
    # =========================
    - name: KernelSU
      run: |
        rm -rf KernelSU

        git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU \
        || git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU

        bash KernelSU/kernel/setup.sh legacy || true

    # =========================
    # Build
    # =========================
    - name: Build kernel
      run: |
        set +e
        START=$(date +%s)

        export PATH="/tmp/clang/bin:$PATH"
        export ARCH=${ARCH}
        export SUBARCH=${ARCH}

        make -j$(nproc) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LLVM=1 LLVM_IAS=1 \
          2>&1 | tee build.log

        echo "B_TIME=$(($(date +%s)-START))" >> $GITHUB_ENV

    # =========================
    # Detect Image (SAFE)
    # =========================
    - name: Detect image
      run: |
        if [ -f out/arch/${ARCH}/boot/Image.gz-dtb ]; then
          echo "KERNEL_IMAGE=Image.gz-dtb" >> $GITHUB_ENV
        elif [ -f out/arch/${ARCH}/boot/Image.gz ]; then
          echo "KERNEL_IMAGE=Image.gz" >> $GITHUB_ENV
        else
          echo "KERNEL_IMAGE=Image" >> $GITHUB_ENV
        fi

    # =========================
    # Artifact
    # =========================
    - name: Artifact name
      run: |
        echo "ARTIFACT_NAME=Mayuri-${GITHUB_SHA::7}" >> $GITHUB_ENV

    # =========================
    # AnyKernel (FIX missing file)
    # =========================
    - name: Package
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
        cd anykernel

        cp ../out/arch/${ARCH}/boot/${KERNEL_IMAGE} ./ || exit 1

        zip -r9 ../${ARTIFACT_NAME}.zip . \
          -x "*.git*" "*README*"

    # =========================
    # Hash
    # =========================
    - name: Hash
      run: |
        echo "Z_MD5=$(md5sum ${ARTIFACT_NAME}.zip | awk '{print $1}')" >> $GITHUB_ENV
        echo "Z_SHA256=$(sha256sum ${ARTIFACT_NAME}.zip | awk '{print $1}')" >> $GITHUB_ENV

    # =========================
    # TELEGRAM (UNCHANGED FORMAT)
    # =========================
    - name: Telegram notify
      if: always()
      run: |
        set +e

        B_MIN=$((B_TIME / 60))
        B_SEC=$((B_TIME % 60))

        if [ "${{ job.status }}" = "success" ]; then

          CAPTION="✅ Mayuri Kernel\nDevice: ${DEVICE_TREE}\nBuild: ${B_MIN}m ${B_SEC}s\nBranch: ${GITHUB_REF_NAME}\nCommit: ${GITHUB_SHA::7}\nKSU: ${KSU_VERSION} (${KSU_TAG})\n\nMD5: \`${Z_MD5}\`\nSHA256: \`${Z_SHA256}\`"

          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"; do
            curl -s -F chat_id="$CHAT" \
              -F document=@"${ARTIFACT_NAME}.zip" \
              -F caption="$CAPTION" \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done

        else

          FAIL="❌ Mayuri Kernel FAILED\nDevice: ${DEVICE_TREE}\nBranch: ${GITHUB_REF_NAME}\nCommit: ${GITHUB_SHA::7}\nCheck build.log"

          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"; do
            curl -s -F chat_id="$CHAT" \
              -F document=@build.log \
              -F caption="$FAIL" \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done

        fi

    # =========================
    # GitHub Summary
    # =========================
    - name: Summary
      if: always()
      run: |
        {
          echo "# Mayuri Kernel (Stable)"
          echo "| Status | ${{ job.status }} |"
          echo "| Commit | ${GITHUB_SHA::7} |"
          echo "| Build Time | ${B_TIME}s |"
          echo "| MD5 | ${Z_MD5} |"
          echo "| SHA256 | ${Z_SHA256} |"
        } >> $GITHUB_STEP_SUMMARY
