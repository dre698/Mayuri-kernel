name: Mayuri Kernel Production CI (Stable)

on:
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: blossom_defconfig
  KERNEL_ARCH: arm64
  KBUILD_BUILD_USER: dre698
  KBUILD_BUILD_HOST: github-actions

  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
  GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex build-essential git zip curl wget ccache \
          libssl-dev libelf-dev cpio kmod jq

    - name: Clang toolchain
      run: |
        git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r428724.git /tmp/clang

    - name: Setup environment
      run: |
        echo "ARCH=${KERNEL_ARCH}" >> $GITHUB_ENV
        echo "SUBARCH=${KERNEL_ARCH}" >> $GITHUB_ENV

        echo "CC=clang" >> $GITHUB_ENV
        echo "CROSS_COMPILE=" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

        echo "PATH=/tmp/clang/bin:$PATH" >> $GITHUB_ENV

        # FIX missing device label
        echo "DEVICE_TREE=blossom" >> $GITHUB_ENV

    # =========================
    # TELEGRAM PROGRESS INIT
    # =========================
    - name: Telegram init progress
      run: |
        RESP=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d chat_id="${PRIVATE_CHAT_ID}" \
          -d text="🚀 Mayuri Kernel CI started...")

        MSG_ID=$(echo $RESP | jq -r '.result.message_id')
        echo "TG_MSG_ID=$MSG_ID" >> $GITHUB_ENV

    - name: Update Telegram progress (setup)
      run: |
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
          -d chat_id="${PRIVATE_CHAT_ID}" \
          -d message_id="${TG_MSG_ID}" \
          -d text="⚙️ Setting up toolchain..."

    - name: Clean source
      run: make mrproper || true

    - name: Configure kernel
      run: |
        mkdir -p out
        make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG} < /dev/null
        yes "" | make O=out ARCH=${ARCH} olddefconfig

    - name: Update Telegram progress (config done)
      run: |
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
          -d chat_id="${PRIVATE_CHAT_ID}" \
          -d message_id="${TG_MSG_ID}" \
          -d text="🔧 Config complete. Starting build..."

    - name: KernelSU Integration
      run: |
        rm -rf KernelSU
        git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU || \
        git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU || \
        git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU

        bash KernelSU/kernel/setup.sh legacy || true

    - name: Build kernel
      run: |
        START=$(date +%s)

        make -j$(nproc) O=out \
          ARCH=${ARCH} \
          CC=clang \
          CLANG_TRIPLE=${CLANG_TRIPLE} \
          KBUILD_BUILD_USER=${KBUILD_BUILD_USER} \
          KBUILD_BUILD_HOST=${KBUILD_BUILD_HOST} \
          2>&1 | tee build.log || true

        echo "B_TIME=$(($(date +%s)-START))" >> $GITHUB_ENV

    - name: Update Telegram progress (build done)
      run: |
        curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
          -d chat_id="${PRIVATE_CHAT_ID}" \
          -d message_id="${TG_MSG_ID}" \
          -d text="🛠 Build finished. Packaging..."

    - name: Detect image
      run: |
        if [ -f out/arch/${ARCH}/boot/Image.gz-dtb ]; then
          echo "KERNEL_IMAGE=Image.gz-dtb" >> $GITHUB_ENV
        elif [ -f out/arch/${ARCH}/boot/Image.gz ]; then
          echo "KERNEL_IMAGE=Image.gz" >> $GITHUB_ENV
        else
          echo "KERNEL_IMAGE=Image" >> $GITHUB_ENV
        fi

    - name: Artifact name
      run: |
        echo "ARTIFACT_NAME=Mayuri-${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Package AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
        cp out/arch/${ARCH}/boot/${KERNEL_IMAGE} anykernel/

        cd anykernel
        zip -r9 ../${ARTIFACT_NAME}.zip . -x "*.git*" "*README*"

    - name: Hash
      run: |
        echo "Z_MD5=$(md5sum ${ARTIFACT_NAME}.zip | awk '{print $1}')" >> $GITHUB_ENV
        echo "Z_SHA256=$(sha256sum ${ARTIFACT_NAME}.zip | awk '{print $1}')" >> $GITHUB_ENV

    - name: Final Telegram update (printf)
      if: always()
      run: |
        set +e

        B_MIN=$((B_TIME / 60))
        B_SEC=$((B_TIME % 60))

        if [ "${{ job.status }}" = "success" ]; then

          CAPTION=$(printf "✅ Mayuri Kernel\nDevice: %s\nBuild: %sm %ss\nBranch: %s\nCommit: %s\nKSU: %s (%s)\n\nMD5: \\`%s\\`\nSHA256: \\`%s\\`" \
            "$DEVICE_TREE" "$B_MIN" "$B_SEC" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" \
            "$KSU_VERSION" "$KSU_TAG" "$Z_MD5" "$Z_SHA256")

          TEXT="SUCCESS"

          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"; do
            curl -s --retry 3 \
              -F chat_id="$CHAT" \
              -F document=@"${ARTIFACT_NAME}.zip" \
              -F caption="$CAPTION" \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done

        else

          FAIL=$(printf "❌ Mayuri Kernel FAILED\nDevice: %s\nBranch: %s\nCommit: %s\nCheck build.log" \
            "$DEVICE_TREE" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}")

          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"; do
            curl -s --retry 3 \
              -F chat_id="$CHAT" \
              -F document=@build.log \
              -F caption="$FAIL" \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done
        fi

    - name: Summary
      if: always()
      run: |
        {
          echo "# Mayuri Kernel (Stable)"
          echo "| Status | ${{ job.status }} |"
          echo "| Branch | ${GITHUB_REF_NAME} |"
          echo "| Commit | ${GITHUB_SHA::7} |"
          echo "| Time | ${B_TIME}s |"
          echo "| MD5 | ${Z_MD5} |"
          echo "| SHA256 | ${Z_SHA256} |"
        } >> $GITHUB_STEP_SUMMARY
