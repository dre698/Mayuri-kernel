name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Clone kernel
        run: |
          git clone --depth=1 https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom source

      - name: ⚙️ Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git bc bison flex build-essential \
            libssl-dev libelf-dev zlib1g-dev \
            clang lld llvm python2 zip curl

          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: 🔧 Clone clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: ☢️ Telegram start
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🚀 VoidLine Kernel Rebirth non-ksu blossom build started"

      - name: 🛠️ Build kernel
        run: |
          cd source
          mkdir -p out

          export ARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          make O=out blossom_defconfig
          make O=out olddefconfig

          # ✅ правильное имя (без пробелов!)
          echo "CONFIG_LOCALVERSION=\"-VoidLine_Kernel_Rebirth-non-ksu-blossom\"" >> out/.config

          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            2>&1 | tee build.log

      - name: 📦 Create ZIP
        run: |
          IMAGE=$(find source/out -type f -name "Image*" | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "❌ kernel not found"
            exit 1
          fi

          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz

          cd ak3

          # 🔥 УБИРАЕМ ВСЕ СТАРЫЕ БАННЕРЫ (включая White Society)
          sed -i '/ui_print/d' anykernel.sh

          # 🔥 ТОП БАННЕР (ЧИСТЫЙ, НЕ ЛАГАЕТ)
          sed -i '1i\
          ui_print "==============================";\
          ui_print " VoidLine Kernel Rebirth";\
          ui_print "   non-ksu blossom";\
          ui_print "------------------------------";\
          ui_print " Based on Niigo Kernel";\
          ui_print " Built by LineXin";\
          ui_print "==============================";\
          ui_print " ";' anykernel.sh

          ZIP_NAME="VoidLine_Kernel_Rebirth-non-ksu-blossom.zip"
          zip -r9 ../$ZIP_NAME * -x .git* README.md

          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: ⬆️ Upload
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine_Kernel_Rebirth-non-ksu-blossom
          path: ${{ env.ZIP_NAME }}

      - name: ✅ Telegram success
        if: success()
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F document=@${{ env.ZIP_NAME }} \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: ❌ Telegram fail
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ VoidLine build failed"
