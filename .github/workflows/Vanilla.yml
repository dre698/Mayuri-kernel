name: VoidLine Kernel Rebirth blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  DEFCONFIG: blossom
  CCACHE_DIR: /tmp/ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      - name: 📥 Clone kernel (niigo)
        run: |
          git clone --depth=1 https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom source

      - name: ⚙️ Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git bc bison flex build-essential \
            libssl-dev libelf-dev zlib1g-dev \
            clang lld llvm gcc g++ \
            python2 ninja-build zip curl ccache

          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: 🔧 Clone toolchains
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: ☢️ Telegram start
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🚀 VoidLine build started"

      - name: 🛠️ Build kernel
        run: |
          cd source
          mkdir -p out
          START=$(date +%s)

          export ARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH

          make O=out ${DEFCONFIG}_defconfig

          # 🔥 SAFE GAMING PATCH (без риска)
          scripts/config --file out/.config -d DEBUG_KERNEL || true
          scripts/config --file out/.config -d DEBUG_INFO || true

          echo "CONFIG_HZ_300=y" >> out/.config
          echo "CONFIG_HZ=300" >> out/.config
          echo "CONFIG_LOCALVERSION=\"-VoidLine-Gaming\"" >> out/.config

          make olddefconfig O=out

          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            2>&1 | tee build.log

          END=$(date +%s)
          echo "BUILD_TIME=$((END - START))" >> $GITHUB_ENV

      - name: 📦 Prepare ZIP
        run: |
          IMAGE=$(find source/out/arch/arm64/boot -name "Image.gz*" | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "❌ kernel not found"
            exit 1
          fi

          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3

          cp "$IMAGE" ak3/Image.gz
          cd ak3

          sed -i 's/device.name1=.*/device.name1=blossom/g' anykernel.sh

          # 🔥 ASCII BANNER
          cat >> anykernel.sh << 'EOF'
          ui_print " "
          ui_print "██╗   ██╗ ██████╗ ██╗██████╗ ██╗     ██╗███╗   ██╗███████╗"
          ui_print "██║   ██║██╔═══██╗██║██╔══██╗██║     ██║████╗  ██║██╔════╝"
          ui_print "██║   ██║██║   ██║██║██║  ██║██║     ██║██╔██╗ ██║█████╗  "
          ui_print "╚██╗ ██╔╝██║   ██║██║██║  ██║██║     ██║██║╚██╗██║██╔══╝  "
          ui_print " ╚████╔╝ ╚██████╔╝██║██████╔╝███████╗██║██║ ╚████║███████╗"
          ui_print "  ╚═══╝   ╚═════╝ ╚═╝╚═════╝ ╚══════╝╚═╝╚═╝  ╚═══╝╚══════╝"
          ui_print " "
          ui_print "🔥 VoidLine Kernel Rebirth 🔥"
          ui_print "Gaming Edition"
          ui_print "Built by LineXin"
          ui_print " "
          EOF

          ZIP_NAME="VoidLine-Gaming.zip"
          zip -r9 ../$ZIP_NAME * -x .git* README.md

          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine-Kernel
          path: ${{ env.ZIP_NAME }}
      - name: ✅ Telegram success
        if: success()
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F document=@${{ env.ZIP_NAME }} \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: ❌ Telegram fail
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ Build failed"
