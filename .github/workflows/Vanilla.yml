# ==========================================
# Project: VoidLine Kernel Rebirth
# Device: Blossom (Redmi 9C)
# Version: Vanilla Edition
# ==========================================

name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom
  # Основное имя выходного файла
  ZIP_NAME: "VoidLine-Kernel-Rebirth-Blossom.zip"
  # Настройки Telegram (берутся из Secrets)
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    name: Build Kernel on Ubuntu-22.04
    runs-on: ubuntu-22.04

    steps:
      - name: 1.0 Checkout Source Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: 1.1 Check System Resources
        run: |
          echo "--- Информация о системе ---"
          lscpu | grep "Model name"
          free -h
          df -h /
          echo "----------------------------"

      - name: 1.2 Notify Start on Telegram
        run: |
          VERSION=$(awk -F'=' '/^VERSION[[:space:]]*=/ {v=$2} /^PATCHLEVEL[[:space:]]*=/ {p=$2} /^SUBLEVEL[[:space:]]*=/ {s=$2} END {gsub(/^[ \t]+|[ \t]+$/,"",v); gsub(/^[ \t]+|[ \t]+$/,"",p); gsub(/^[ \t]+|[ \t]+$/,"",s); printf "%s.%s.%s", v, p, s}' Makefile)
          MSG="☢️ *Kernel Build Started!*%0A*Project:* VoidLine Rebirth%0A*Device:* Blossom%0A*Kernel:* $VERSION%0A*Commit:* [${GITHUB_SHA::7}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MSG" \
            -d "parse_mode=Markdown"

      - name: 2.0 Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python

      - name: 2.1 Fetch Toolchains (Clang & GCC)
        run: |
          echo "Cloning Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          echo "Cloning GCC 64-bit..."
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          echo "Cloning GCC 32-bit..."
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: 3.0 Clean and Patch Makefile
        run: |
          echo "Удаляем флаги, вызывающие ошибки компиляции..."
          # Полное удаление -Werror и связанных флагов
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror[^ ]*//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wimplicit-function-declaration//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wreturn-type//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wunused-variable//g' {} +

      - name: 4.0 Prepare Kernel Configuration
        run: |
          mkdir -p out
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          echo "Генерируем конфиг: $DEFCONFIG..."
          make O=out ${DEFCONFIG}_defconfig
          
          # Увеличиваем лимит предупреждений стека
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=8192/g' out/.config
          echo "Конфигурация готова."

      - name: 5.0 Execute Kernel Compilation
        run: |
          START_TIME=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          set -o pipefail
          echo "Запуск компиляции на $(nproc --all) ядрах..."
          
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log
            
          END_TIME=$(date +%s)
          echo "BUILD_DURATION=$((END_TIME - START_TIME))" >> $GITHUB_ENV
        continue-on-error: false

      - name: 6.0 Packaging (AnyKernel3)
        if: success()
        run: |
          echo "Поиск собранного ядра..."
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          
          if [ -z "$IMAGE" ]; then
            echo "❌ ОШИБКА: Файл ядра не найден в out/!"
            exit 1
          fi
          
          echo "Клонирование AnyKernel3 для Blossom..."
          git clone --depth=1 https://github.com/LineXin/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          
          cd ak3
          # Настройка скрипта установки
          sed -i 's/device.name1=maguro/device.name1=blossom/g' anykernel.sh
          
          echo "Создание ZIP-архива..."
          zip -r9 ../${{ env.ZIP_NAME }} * -x .git* README.md
          cd ..
          
          echo "ZIP_MD5=$(md5sum ${{ env.ZIP_NAME }} | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: 7.0 Upload Result to Telegram
        if: success()
        run: |
          CAPTION="✅ *Build Successful!*%0A⏱ *Time:* ${{ env.BUILD_DURATION }}s%0A🔐 *MD5:* \`${{ env.ZIP_MD5 }}\`%0A📱 *Device:* Blossom"
          curl -s -F chat_id="$CHAT_ID" \
            -F document=@${{ env.ZIP_NAME }} \
            -F caption="$CAPTION" \
            -F parse_mode=Markdown \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

      - name: 8.0 Handle Build Failure
        if: failure()
        run: |
          echo "Сборка провалилась. Подготовка лога для отправки..."
          if [ -f build.log ]; then
            curl -s -F chat_id="$CHAT_ID" \
              -F document=@build.log \
              -F caption="❌ *VoidLine Build Failed!*%0AПроверь файл лога для поиска ошибок." \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=❌ *Critical Error!* Лог сборки даже не был создан."
          fi

      - name: 9.0 Workspace Cleanup
        if: always()
        run: |
          echo "Очистка временных файлов..."
          rm -rf out ak3 clang gcc64 gcc
          echo "Готово."

# --- Конец скрипта ---
# GitHub Actions Workflow by LineXin
# ==========================================
