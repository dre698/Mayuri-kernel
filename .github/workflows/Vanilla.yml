name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Notify start on Telegram
        run: |
          VERSION=$(grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" Makefile | awk '{print $3}' | tr '\n' '.' | sed 's/\.$//')
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text=☢️ *VoidLine Kernel Build Started!*
            *Device:* Blossom
            *Kernel Version:* $VERSION
            *Commit:* [${GITHUB_SHA::7}](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA})" \
            -d parse_mode=Markdown

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: Build the kernel
        run: |
          mkdir -p out
          START=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wimplicit-int//g' {} +
          
          make O=out ${DEFCONFIG}_defconfig
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KBUILD_BUILD_USER="LineXin" \
            KBUILD_BUILD_HOST="VoidLine" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log
            
          echo "BUILD_TIME=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Create AnyKernel3 Zip
        if: success()
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          git clone --depth=1 https://github.com/LineXin/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          cd ak3
          
          zip -r9 ../VoidLine_Kernel_blossom.zip * -x .git* README.md
          cd ..
          echo "ZIP_MD5=$(md5sum VoidLine_Kernel_blossom.zip | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: Notify Telegram
        if: always()
        run: |
          if [ -f VoidLine_Kernel_blossom.zip ]; then
            FILE="VoidLine_Kernel_blossom.zip"
            CAPTION="✅ *Build Successful!*%0A⏱ *Time:* ${{ env.BUILD_TIME }}s%0A🔐 *MD5:* \`${{ env.ZIP_MD5 }}\`"
          else
            FILE="build.log"
            CAPTION="❌ *Build Failed!* Проверь логи."
          fi
          
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@$FILE \
            -F caption="$CAPTION" \
            -F parse_mode=Markdown \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
