name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  DEFCONFIG: blossom
  CCACHE_DIR: /tmp/ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 📥 Clone kernel source
        run: |
          git clone --depth=1 https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom source

      - name: ⚙️ Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git bc bison flex build-essential \
            libssl-dev libelf-dev zlib1g-dev \
            clang lld llvm python2 zip curl \
            ccache make

          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: 🔧 Clone clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: 📢 Telegram start message
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🚀 VoidLine Kernel Rebirth non-ksu blossom build started"

      - name: 🛠️ Build kernel
        run: |
          set -e

          cd source
          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          echo "👉 Using LLVM toolchain"
          clang --version

          echo "👉 Load defconfig"
          make O=out ${DEFCONFIG}_defconfig

          echo "👉 Apply config"
          make O=out olddefconfig

          echo "👉 Apply branding"
          echo "CONFIG_LOCALVERSION=\"-VoidLine_Kernel_Rebirth-non-ksu-blossom\"" >> out/.config

          echo "👉 Start compilation"
          make -j$(nproc --all) O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            2>&1 | tee build.log

      - name: 🔍 Debug kernel output
        run: |
          echo "Listing build output..."
          ls -R source/out/arch/arm64 || true

      - name: 📦 Prepare AnyKernel3
        run: |
          set -e

          IMAGE=$(find source/out/arch/arm64/boot -type f \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "❌ Kernel не собрался"
            exit 1
          fi

          echo "✅ Kernel found: $IMAGE"

          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3

          cp "$IMAGE" ak3/Image.gz

          cd ak3

          echo "👉 Cleaning old banners"
          sed -i '/ui_print/d' anykernel.sh

          echo "👉 Injecting clean banner"
          sed -i '1i\
          ui_print "==============================";\
          ui_print " VoidLine Kernel Rebirth";\
          ui_print "   non-ksu blossom";\
          ui_print "------------------------------";\
          ui_print " Based on Niigo Kernel";\
          ui_print " Built by LineXin";\
          ui_print "==============================";\
          ui_print " ";' anykernel.sh

          echo "👉 Packing ZIP"
          ZIP_NAME="VoidLine_Kernel_Rebirth-non-ksu-blossom.zip"
          zip -r9 ../$ZIP_NAME * -x .git* README.md

          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine_Kernel_Rebirth-non-ksu-blossom
          path: ${{ env.ZIP_NAME }}

      - name: 📤 Send to Telegram (success)
        if: success()
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F document=@${{ env.ZIP_NAME }} \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: ❌ Send fail message
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ VoidLine build failed"

      - name: 📄 Upload log (on fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: source/build.log

      - name: 🧹 Cleanup
        run: |
          echo "Cleaning workspace..."
          rm -rf ak3 || true
          rm -rf source/out || true

      - name: 🟢 Done
        run: |
          echo "Build workflow finished"
