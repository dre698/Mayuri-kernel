name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Notify start on Telegram
        run: |
          VERSION=$(awk -F'=' '
          /^VERSION[[:space:]]*=/ {v=$2}
          /^PATCHLEVEL[[:space:]]*=/ {p=$2}
          /^SUBLEVEL[[:space:]]*=/ {s=$2}
          END {
            gsub(/^[ \t]+|[ \t]+$/,"",v); gsub(/^[ \t]+|[ \t]+$/,"",p); gsub(/^[ \t]+|[ \t]+$/,"",s);
            if (v=="") v="0"; if (p=="") p="0"; if (s=="") s="0";
            printf "%s.%s.%s", v, p, s
          }' Makefile)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text=☢️ *VoidLine Kernel Build Started!*
            *Device:* Blossom
            *Version:* non-ksu
            *Kernel Version:* $VERSION
            *Commit:* [${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${{ github.repository }}/commit/${GITHUB_SHA})" \
            -d parse_mode=Markdown

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: Build the kernel
        run: |
          mkdir -p out
          START=$(date +%s)
          export ARCH=arm64
          export CLANG_PATH="$PWD/clang/bin"
          export GCC32_PATH="$PWD/gcc/bin"
          export GCC64_PATH="$PWD/gcc64/bin"
          export PATH="$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH"
          
          # Отключаем ошибки компилятора
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror//g' {} +
          
          make O=out ${DEFCONFIG}_defconfig
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=8192/g' out/.config
          
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KBUILD_BUILD_USER="LineXin" \
            KBUILD_BUILD_HOST="VoidLine" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log
          
          END=$(date +%s)
          echo "BUILD_TIME=$((END - START))" >> $GITHUB_ENV

      - name: Set build info
        run: |
          IMAGE_PATH=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -n "$IMAGE_PATH" ]; then
            echo "IMAGE_FOUND=$IMAGE_PATH" >> $GITHUB_ENV
            echo "✅ Ядро найдено: $IMAGE_PATH"
          else
            echo "❌ Ядро не найдено!"
            exit 1
          fi

      - name: Create AnyKernel3 Zip
        if: success()
        run: |
          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3
          cp "${{ env.IMAGE_FOUND }}" ak3/Image.gz
          cd ak3
          
          echo "👉 Безопасное удаление старых надписей..."
          # Удаляем ТОЛЬКО строки со старым названием, не ломая остальные команды ui_print!
          find . -type f -exec sed -i '/White Kernel Project/Id' {} +
          find . -type f -exec sed -i '/Maintainer: MrGadget84/Id' {} +
          find . -type f -exec sed -i '/White Society/Id' {} +
          
          echo "👉 Вставка баннера VoidLine..."
          cat << 'EOF' > banner.txt
          ui_print " ";
          ui_print "==============================";
          ui_print "   VoidLine Kernel Rebirth";
          ui_print "       non-ksu blossom";
          ui_print "------------------------------";
          ui_print "      Built by LineXin";
          ui_print "==============================";
          ui_print " ";
          EOF
          
          # Убираем пробелы слева в banner.txt
          sed -i 's/^[[:space:]]*//' banner.txt
          
          # Вставляем наш файл на 2-ю строчку (сразу после #!/system/bin/sh)
          sed -i '2r banner.txt' anykernel.sh
          
          echo "👉 Обновление конфига устройства..."
          sed -i 's/kernel\.string=.*/kernel.string=VoidLine Kernel Rebirth/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=blossom/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot|g' anykernel.sh
          
          zip -r9 ../VoidLine_Kernel_non-ksu_blossom.zip * -x .git* README.md banner.txt
          cd ..
          
          echo "ZIP_MD5=$(md5sum VoidLine_Kernel_non-ksu_blossom.zip | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine_Kernel_Blossom
          path: VoidLine_Kernel_non-ksu_blossom.zip

      - name: Notify success on Telegram
        if: success()
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@VoidLine_Kernel_non-ksu_blossom.zip \
            -F caption="✅ *Build Successful!*
            ⏱ *Time:* ${{ env.BUILD_TIME }}s
            🔐 *MD5:* \`${{ env.ZIP_MD5 }}\`
            📱 *Device:* Blossom" \
            -F parse_mode=Markdown \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: Send build log
        if: always()
        run: |
          curl -s -F document=@build.log \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&caption=📄 Kernel build log"
