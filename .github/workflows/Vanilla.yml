name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: Build the kernel
        run: |
          mkdir -p out
          START=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          find . -name "Makefile*" -exec sed -i 's/-Werror//g' {} +
          
          make O=out ${DEFCONFIG}_defconfig
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KBUILD_BUILD_USER="LineXin" \
            KBUILD_BUILD_HOST="VoidLine" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log
            
          echo "BUILD_TIME=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Create AnyKernel3 Zip
        if: success()
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          cd ak3
          
          echo "👉 Удаляем всё старое барахло..."
          # Удаляем вообще всё содержимое anykernel.sh и пишем своё с нуля
          cat << 'EOF' > anykernel.sh
#!/usr/bin/sh
# AnyKernel3 Distribution by osm0sis
# Modified by LineXin for VoidLine Kernel

          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=blossom
          device.name2=angelica
          device.name3=dandelion
          device.name4=angelican
          device.name5=angelicain
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

# UI Print
          ui_print " ";
          ui_print "==============================";
          ui_print "    VoidLine Kernel Rebirth";
          ui_print "        non-ksu blossom";
          ui_print "------------------------------";
          ui_print "       Built by LineXin";
          ui_print "==============================";
          ui_print " ";

## AnyKernel methods (DO NOT CHANGE)
# import patching functions/variables - see for reference
          . tools/ak3-core.sh;

## AnyKernel install
          dump_boot;
          write_boot;
## end install
          EOF
          
          echo "👉 Финальная чистка от захардкоженного мусора в других файлах..."
          # Если тролль засунул надпись в бинарники tools/, мы их тоже почистим
          find . -type f -exec sed -i 's/Хахахах, не получилось поменять мой banner, лашпед :)/ /g' {} +
          find . -type f -exec sed -i 's/White Society/ /g' {} +
          
          zip -r9 ../VoidLine_Kernel_blossom.zip * -x .git* README.md
          cd ..
          echo "ZIP_MD5=$(md5sum VoidLine_Kernel_blossom.zip | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: Notify Telegram
        if: success()
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@VoidLine_Kernel_blossom.zip \
            -F caption="✅ *Build Successful!*
            ⏱ *Time:* ${{ env.BUILD_TIME }}s
            🔐 *MD5:* \`${{ env.ZIP_MD5 }}\`
            Тролль слит, баннер наш." \
            -F parse_mode=Markdown \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
