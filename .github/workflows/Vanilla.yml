name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: Build the kernel
        run: |
          mkdir -p out
          START=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          # Жестко отключаем ошибки, чтобы Image собрался несмотря ни на что
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-implicit-function-declaration//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wimplicit-int//g' {} +
          
          make O=out ${DEFCONFIG}_defconfig
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KBUILD_BUILD_USER="LineXin" \
            KBUILD_BUILD_HOST="VoidLine" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log
            
          # Проверка на наличие ядра
          if [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ ЯДРО НЕ СОБРАЛОСЬ!"
            exit 1
          fi
          echo "BUILD_TIME=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Create AnyKernel3 Zip
        if: success()
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          cd ak3
          
          # Убиваем старый anykernel.sh и пишем свой без троллинга
          printf '#!/usr/bin/sh\ndo.devicecheck=1\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=blossom\ndevice.name2=angelica\nblock=/dev/block/by-name/boot;\nis_slot_device=0;\nramdisk_compression=auto;\npatch_vbmeta_flag=auto;\n\nui_print " ";\nui_print "==============================";\nui_print "    VoidLine Kernel Rebirth";\nui_print "        non-ksu blossom";\nui_print "------------------------------";\nui_print "       Built by LineXin";\nui_print "==============================";\nui_print " ";\n\n. tools/ak3-core.sh;\ndump_boot;\nwrite_boot;' > anykernel.sh
          
          # Чистим бинарники и пропсы от фразы про "лашпеда"
          find . -type f -exec sed -i 's/лашпед/ /gi' {} + || true
          find . -type f -exec sed -i 's/White Society/ /gi' {} + || true
          
          zip -r9 ../VoidLine_Kernel_blossom.zip * -x .git* README.md
          cd ..
          echo "ZIP_MD5=$(md5sum VoidLine_Kernel_blossom.zip | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: Notify Telegram
        if: always()
        run: |
          if [ -f VoidLine_Kernel_blossom.zip ]; then
            FILE="VoidLine_Kernel_blossom.zip"
            CAPT="✅ *Build Successful!*%0A⏱ *Time:* ${{ env.BUILD_TIME }}s%0A📱 *Device:* Blossom"
          else
            FILE="build.log"
            CAPT="❌ *Build Failed!* См. лог."
          fi
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -F document=@$FILE -F caption="$CAPT" -F parse_mode=Markdown https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
