name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Notify start on Telegram
        run: |
          VERSION=$(awk -F'=' '
          /^VERSION[[:space:]]*=/ {v=$2}
          /^PATCHLEVEL[[:space:]]*=/ {p=$2}
          /^SUBLEVEL[[:space:]]*=/ {s=$2}
          END {
            gsub(/^[ \t]+|[ \t]+$/,"",v); gsub(/^[ \t]+|[ \t]+$/,"",p); gsub(/^[ \t]+|[ \t]+$/,"",s);
            printf "%s.%s.%s", v, p, s
          }' Makefile)

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text=🚀 VoidLine build started
Device: Blossom
Version: Gaming Edition
Kernel: $VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git build-essential bc bison flex \
            libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ \
            python2 ninja-build zip ccache curl

          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: Build the kernel and log output
        run: |
          mkdir -p out
          START=$(date +%s)

          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"

          make O=out ${DEFCONFIG}_defconfig

          # 🔥 VOIDLINE GAMING PATCH
          sed -i 's/CONFIG_DEBUG_KERNEL=y/CONFIG_DEBUG_KERNEL=n/g' out/.config
          sed -i 's/CONFIG_DEBUG_INFO=y/CONFIG_DEBUG_INFO=n/g' out/.config
          echo "CONFIG_HZ_300=y" >> out/.config
          echo "CONFIG_HZ=300" >> out/.config
          echo "CONFIG_ZRAM=y" >> out/.config
          echo "CONFIG_ZRAM_DEF_COMP_LZ4=y" >> out/.config
          echo "CONFIG_IOSCHED_DEADLINE=y" >> out/.config
          echo "CONFIG_LOCALVERSION=\"-VoidLine-Gaming\"" >> out/.config

          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            2>&1 | tee build.log

          END=$(date +%s)
          echo "BUILD_TIME=$((END - START))" >> $GITHUB_ENV

      - name: Create AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" | head -n 1)
          cp "$IMAGE" ak3/Image.gz

          cd ak3

          # 🔥 ASCII BANNER
          cat >> anykernel.sh << 'EOF'
ui_print " "
ui_print "██╗   ██╗ ██████╗ ██╗██████╗ ██╗     ██╗███╗   ██╗███████╗"
ui_print "██║   ██║██╔═══██╗██║██╔══██╗██║     ██║████╗  ██║██╔════╝"
ui_print "██║   ██║██║   ██║██║██║  ██║██║     ██║██╔██╗ ██║█████╗  "
ui_print "╚██╗ ██╔╝██║   ██║██║██║  ██║██║     ██║██║╚██╗██║██╔══╝  "
ui_print " ╚████╔╝ ╚██████╔╝██║██████╔╝███████╗██║██║ ╚████║███████╗"
ui_print "  ╚═══╝   ╚═════╝ ╚═╝╚═════╝ ╚══════╝╚═╝╚═╝  ╚═══╝╚══════╝"
ui_print " "
ui_print "🔥 VoidLine Kernel Rebirth 🔥"
ui_print "Gaming Edition"
ui_print "Built by LineXin"
ui_print " "
EOF

          zip -r9 ../VoidLine_Kernel_Rebirth.zip *
          cd ..

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine-Kernel
          path: VoidLine_Kernel_Rebirth.zip

      - name: Send to Telegram
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F document=@VoidLine_Kernel_Rebirth.zip \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
