name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Notify start on Telegram
        run: |
          VERSION=$(awk -F'=' '
          /^VERSION[[:space:]]*=/ {v=$2}
          /^PATCHLEVEL[[:space:]]*=/ {p=$2}
          /^SUBLEVEL[[:space:]]*=/ {s=$2}
          END {
            gsub(/^[ \t]+|[ \t]+$/,"",v); gsub(/^[ \t]+|[ \t]+$/,"",p); gsub(/^[ \t]+|[ \t]+$/,"",s);
            if (v=="") v="0"; if (p=="") p="0"; if (s=="") s="0";
            printf "%s.%s.%s", v, p, s
          }' Makefile)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text=☢️ *Kernel Build Started!*
            *Device:* Blossom
            *Version:* Vanilla beta 0.2.1
            *Kernel Version:* $VERSION
            *Commit:* [${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${{ github.repository }}/commit/${GITHUB_SHA})" \
            -d parse_mode=Markdown

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc
          
      - name: Build the kernel
        run: |
          mkdir -p out
          START=$(date +%s)
          export ARCH=arm64
          export CLANG_PATH="$PWD/clang/bin"
          export GCC32_PATH="$PWD/gcc/bin"
          export GCC64_PATH="$PWD/gcc64/bin"
          export PATH="$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH"
          
          # Убираем ошибки предупреждений [cite: 10, 11]
          find . -name "Makefile*" -exec sed -i 's/-Werror//g' {} +
          
          make O=out ${DEFCONFIG}_defconfig
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=8192/g' out/.config
          
          # Сборка с твоим именем (убираем niigo) 
          make -j$(nproc --all) O=out \
            CC=clang HOSTCC=gcc HOSTCXX=g++ \
            KBUILD_BUILD_USER="LineXin" \
            KBUILD_BUILD_HOST="VoidLine" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log || exit 1
          
          echo "BUILD_TIME=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Create AnyKernel3 Zip
        if: success()
        run: |
          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" | head -n 1)
          cp "$IMAGE" ak3/Image.gz

          # Создаем баннер. ВАЖНО: BANNER_EOF и текст имеют отступ! 
          cat << 'BANNER_EOF' > ak3/banner_logo
          ui_print " "
          ui_print "--Ź   --Ź ------Ź --Ź------Ź --Ź     --Ź---Ź   --Ź-------Ź"
          ui_print "--Ś   --Ś--ă===--Ź--Ś--ă==--Ź--Ś     --Ś----Ź  --Ś--ă====-"
          ui_print "--Ś   --Ś--Ś   --Ś--Ś--Ś  --Ś--Ś     --Ś--ă--Ź --Ś-----Ź  "
          ui_print "L--Ź --ă---Ś   --Ś--Ś--Ś  --Ś--Ś     --Ś--ŚL--Ź--Ś--ă==-  "
          ui_print " L----ă- L------ă---Ś------ă--------Ź--Ś--Ś L----Ś-------Ź"
          ui_print "  L===-   L=====- L=-L=====- L======-L=-L=-  L===-L======-"
          ui_print " "
          ui_print "?? VoidLine Kernel Rebirth ??"
          ui_print "Device: Blossom"
          ui_print "Based on Niigo"
          ui_print "Built by LineXin"
          ui_print " "
          BANNER_EOF

          # Удаляем лишние пробелы отступов YAML 
          sed -i 's/^[[:space:]]*//' ak3/banner_logo
          # Вставляем баннер в скрипт установки
          sed -i '2r ak3/banner_logo' ak3/anykernel.sh
          
          cd ak3
          zip -r9 ../VoidLine_Kernel_Rebirth_blossom-non-ksu.zip * -x .git* README.md
          cd ..
          echo "ZIP_MD5=$(md5sum VoidLine_Kernel_Rebirth_blossom-non-ksu.zip | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine_Kernel_Rebirth_blossom-non-ksu
          path: VoidLine_Kernel_Rebirth_blossom-non-ksu.zip

      - name: Notify success on Telegram
        if: success()
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@VoidLine_Kernel_Rebirth_blossom-non-ksu.zip \
            -F caption="✅ *Build Successful!*
            ⏱ *Time:* ${BUILD_TIME}s
            🔐 *MD5:* \`${ZIP_MD5}\`
            📱 *Device:* Blossom" \
            -F parse_mode=Markdown \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: Notify failure on Telegram
        if: failure()
        run: |
          curl -s -F document=@build.log \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&caption=❌ Build failed"
