name: VoidLine Kernel Rebirth non-ksu blossom

on:
  workflow_dispatch:

env:
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 📥 Clone kernel
        run: |
          git clone --depth=1 https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom source

      - name: ⚙️ Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git bc bison flex build-essential \
            libssl-dev libelf-dev zlib1g-dev \
            clang lld llvm python2 zip curl

          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: 🔧 Clone clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: 🛠️ Build kernel
        run: |
          set -e

          cd source
          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          make O=out blossom_defconfig
          make O=out olddefconfig

          echo "CONFIG_LOCALVERSION=\"-VoidLine_Kernel_Rebirth-non-ksu-blossom\"" >> out/.config

          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            2>&1 | tee build.log

      - name: 🔍 Check kernel output
        run: |
          ls -R source/out/arch/arm64/boot || true

      - name: 📦 Prepare ZIP
        run: |
          set -e

          IMAGE=$(find source/out/arch/arm64/boot -type f \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "❌ Kernel не собрался"
            exit 1
          fi

          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz

          cd ak3

          # 🔥 УДАЛЯЕМ СТАРЫЕ БАННЕРЫ
          sed -i '/ui_print/d' anykernel.sh

          # 🔥 ЧИСТЫЙ ТОП БАННЕР
          sed -i '1i\
          ui_print "==============================";\
          ui_print " VoidLine Kernel Rebirth";\
          ui_print "   non-ksu for blossom";\
          ui_print "------------------------------";\
          ui_print " Based on Niigo Kernel";\
          ui_print " Built by LineXin";\
          ui_print "==============================";\
          ui_print " ";' anykernel.sh

          ZIP_NAME="VoidLine_Kernel_Rebirth-non-ksu-blossom.zip"
          zip -r9 ../$ZIP_NAME * -x .git* README.md

          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: ⬆️ Upload
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine_Kernel_Rebirth-non-ksu-blossom
          path: ${{ env.ZIP_NAME }}

      - name: 📤 Telegram
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F document=@${{ env.ZIP_NAME }} \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
