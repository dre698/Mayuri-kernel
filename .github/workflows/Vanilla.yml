# ==============================================================================
# PROJECT: VoidLine Kernel Rebirth
# TARGET DEVICE: Blossom (Redmi 9C/9A)
# VERSION: Vanilla Edition 0.2.3
# AUTHOR: LineXin Development Team
# ==============================================================================

name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom
  ZIP_NAME: "VoidLine-Kernel-Rebirth-non-ksu_Blossom.zip"
  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    name: Industrial Kernel Build
    runs-on: ubuntu-22.04

    steps:
      - name: 1.0 [PRE-BUILD] Initializing Workspace
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: 1.1 [SYSTEM] Environment Diagnostic
        run: |
          echo "--- Сборка на сервере GitHub ---"
          echo "Процессор: $(lscpu | grep 'Model name' | cut -f 2 -d ":")"
          echo "Оперативная память: $(free -h | grep 'Mem' | awk '{print $2}')"
          echo "--------------------------------"

      - name: 1.2 [TELEGRAM] Sending Start Notification
        run: |
          KVER=$(awk -F'=' '/^VERSION[[:space:]]*=/ {v=$2} /^PATCHLEVEL[[:space:]]*=/ {p=$2} /^SUBLEVEL[[:space:]]*=/ {s=$2} END {gsub(/^[ \t]+|[ \t]+$/,"",v); gsub(/^[ \t]+|[ \t]+$/,"",p); gsub(/^[ \t]+|[ \t]+$/,"",s); printf "%s.%s.%s", v, p, s}' Makefile)
          TEXT="☢️ *VoidLine Kernel: Build Started*%0A%0A*📱 Device:* Blossom%0A*🔧 Version:* Vanilla Rebirth%0A*🧬 Kernel:* $KVER"
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown"

      - name: 2.0 [DEPS] Installing Toolchains
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: 3.0 [PATCHING] Safe Makefile Repair
        run: |
          echo "Безопасное исправление Makefile..."
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror[^[:space:])]*//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wimplicit-function-declaration//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-Wreturn-type//g' {} +
          echo "Синтаксис Makefile сохранен."

      - name: 4.0 [CONFIG] Generating Kernel Config
        run: |
          mkdir -p out
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          make O=out ${DEFCONFIG}_defconfig
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=8192/g' out/.config

      - name: 5.0 [BUILD] Compiling VoidLine Kernel
        run: |
          START_TIME=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          set -o pipefail
          echo "Запуск компиляции..."
          
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            LOCALVERSION="-VKR-non-ksu_blossom" \
            KBUILD_WERROR=0 2>&1 | tee build.log
            
          END_TIME=$(date +%s)
          echo "B_TIME=$((END_TIME - START_TIME))" >> $GITHUB_ENV
        continue-on-error: false

      - name: 6.0 [PACKAGE] AnyKernel3 Deployment
        if: success()
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -z "$IMAGE" ]; then exit 1; fi
          
          git clone --depth=1 https://github.com/LineXin/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          cd ak3
          sed -i 's/device.name1=maguro/device.name1=blossom/g' anykernel.sh
          zip -r9 ../${{ env.ZIP_NAME }} * -x .git* README.md
          cd ..
          echo "Z_MD5=$(md5sum ${{ env.ZIP_NAME }} | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: 7.0 [REPORT] Success Upload
        if: success()
        run: |
          CAPTION="✅ *VoidLine Successful!*%0A⏱ *Время:* ${{ env.B_TIME }}s%0A🔐 *MD5:* \`${{ env.Z_MD5 }}\`"
          curl -s -F chat_id="$CHAT_ID" -F document=@${{ env.ZIP_NAME }} \
            -F caption="$CAPTION" -F parse_mode=Markdown \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

      - name: 8.0 [FAILURE] Telegram Reporting
        if: failure()
        run: |
          if [ -f build.log ]; then
            curl -s -F chat_id="$CHAT_ID" -F document=@build.log \
              -F caption="❌ *Build Failed!* Ошибка в коде." \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" -d "text=❌ *Critical Failure!*"
          fi

      - name: 9.0 [CLEANUP] Finalizing
        if: always()
        run: |
          rm -rf out ak3 clang gcc64 gcc
          echo "Завершено."

# ==============================================================================
# END OF WORKFLOW
# ==============================================================================
