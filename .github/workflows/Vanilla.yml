name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: Build the kernel
        run: |
          mkdir -p out
          export ARCH=arm64
          export CLANG_PATH="$PWD/clang/bin"
          export GCC32_PATH="$PWD/gcc/bin"
          export GCC64_PATH="$PWD/gcc64/bin"
          export PATH="$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH"
          
          # Убираем Werror, чтобы не стопорить сборку [cite: 9, 10]
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror//g' {} +
          
          make O=out ${DEFCONFIG}_defconfig
          
          # Сборка с твоими данными [cite: 11]
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KBUILD_BUILD_USER="LineXin" \
            KBUILD_BUILD_HOST="VoidLine" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log

      - name: Create AnyKernel3 Zip
        if: success()
        run: |
          # Ищем ядро (Image.gz или Image) [cite: 13]
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -z "$IMAGE" ]; then
            echo "❌ Ядро не найдено!"
            exit 1
          fi
          
          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3
          cp "$IMAGE" ak3/Image.gz
          cd ak3
          
          # 1. Удаляем ВСЕ старые ui_print из скрипта
          sed -i '/ui_print/d' anykernel.sh
          
          # 2. Создаем файл с твоим новым баннером
          cat << 'EOF' > my_banner
          ui_print " "
          ui_print "=============================="
          ui_print "    VoidLine Kernel Rebirth"
          ui_print "        non-ksu blossom"
          ui_print "------------------------------"
          ui_print "       Built by LineXin"
          ui_print "=============================="
          ui_print " "
          EOF

          # 3. Склеиваем: баннер + остальное содержимое anykernel.sh
          cat my_banner anykernel.sh > anykernel.sh.tmp
          mv anykernel.sh.tmp anykernel.sh
          
          # 4. Фиксим конфиги устройства [cite: 15]
          sed -i 's/device.name1=.*/device.name1=blossom/g' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot|g' anykernel.sh
          
          # Упаковка [cite: 16]
          zip -r9 ../VoidLine_blossom.zip * -x .git* README.md my_banner
          cd ..
          
          # Считаем MD5 правильно для GitHub Actions
          echo "ZIP_MD5=$(md5sum VoidLine_blossom.zip | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine_blossom_zip
          [cite_start]path: VoidLine_blossom.zip [cite: 17]

      - name: Notify Telegram
        if: always()
        run: |
          if [ -f VoidLine_blossom.zip ]; then
            FILE="VoidLine_blossom.zip"
            CAPTION="✅ *Build Successful!*%0A📱 *Device:* Blossom%0A🔐 *MD5:* \`${{ env.ZIP_MD5 }}\`"
          else
            FILE="build.log"
            CAPTION="❌ *Build Failed!* Check logs."
          fi
          
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@$FILE \
            -F caption="$CAPTION" \
            -F parse_mode=Markdown \
            [cite_start]https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument [cite: 19]
