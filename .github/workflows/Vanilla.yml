name: VoidLine Kernel Rebirth non-ksu blossom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Clone repo
        run: |
          git clone --depth=1 https://github.com/LineXin/VoidLine_Kernel_Rebirth_For_Blossom source

      - name: ⚙️ Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential \
          libssl-dev libelf-dev clang lld llvm zip curl git

      - name: 🔧 Clone clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: 🛠️ Build with gaming patch
        run: |
          cd source
          mkdir -p out

          export ARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          make O=out blossom_defconfig

          # 🔥 GAMING PATCH AUTO

          # disable debug
          sed -i 's/CONFIG_DEBUG_KERNEL=y/CONFIG_DEBUG_KERNEL=n/g' out/.config
          sed -i 's/CONFIG_DEBUG_INFO=y/CONFIG_DEBUG_INFO=n/g' out/.config

          # timer boost
          echo "CONFIG_HZ_300=y" >> out/.config
          echo "CONFIG_HZ=300" >> out/.config

          # scheduler tweak
          sed -i 's/sched_migration_cost_ns = .*/sched_migration_cost_ns = 500000;/g' kernel/sched/fair.c || true

          # cpu boost tweak
          sed -i 's/rate_limit_us = .*/rate_limit_us = 500;/g' kernel/sched/cpufreq_schedutil.c || true

          # zram
          echo "CONFIG_ZRAM=y" >> out/.config
          echo "CONFIG_ZRAM_DEF_COMP_LZ4=y" >> out/.config

          # io scheduler
          echo "CONFIG_IOSCHED_DEADLINE=y" >> out/.config

          # branding
          echo "CONFIG_LOCALVERSION=\"-VoidLine-Gaming\"" >> out/.config

          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: 📦 Create ZIP + banner
        run: |
          IMAGE=$(find source/out/arch/arm64/boot -name "Image.gz*" | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "❌ kernel not found"
            exit 1
          fi

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3

          cp $IMAGE ak3/Image.gz
          cd ak3

          # 🔥 ASCII BANNER
          cat >> anykernel.sh << 'EOF'

ui_print " "
ui_print "██╗   ██╗ ██████╗ ██╗██████╗ ██╗     ██╗███╗   ██╗███████╗"
ui_print "██║   ██║██╔═══██╗██║██╔══██╗██║     ██║████╗  ██║██╔════╝"
ui_print "██║   ██║██║   ██║██║██║  ██║██║     ██║██╔██╗ ██║█████╗  "
ui_print "╚██╗ ██╔╝██║   ██║██║██║  ██║██║     ██║██║╚██╗██║██╔══╝  "
ui_print " ╚████╔╝ ╚██████╔╝██║██████╔╝███████╗██║██║ ╚████║███████╗"
ui_print "  ╚═══╝   ╚═════╝ ╚═╝╚═════╝ ╚══════╝╚═╝╚═╝  ╚═══╝╚══════╝"
ui_print " "
ui_print "VoidLine Kernel Rebirth non-ksu "
ui_print "Gaming Edition"
ui_print "Based on Niigo"
ui_print "Built by LineXin"
ui_print " "

EOF

          ZIP_NAME="VoidLine-Gaming-$(date +%Y%m%d).zip"
          zip -r9 ../$ZIP_NAME * -x .git* README.md

          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: ⬆️ Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine-Kernel
          path: ${{ env.ZIP_NAME }}
