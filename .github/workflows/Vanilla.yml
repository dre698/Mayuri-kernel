name: VoidLine Kernel Rebirth non-ksu blossom

on:
  push:
    branches:
      - perf
  workflow_dispatch:

env:
  CCACHE_DIR: /tmp/ccache
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Notify start on Telegram
        run: |
          VERSION=$(awk -F'=' '/^VERSION[[:space:]]*=/ {v=$2} /^PATCHLEVEL[[:space:]]*=/ {p=$2} /^SUBLEVEL[[:space:]]*=/ {s=$2} END {gsub(/^[ \t]+|[ \t]+$/,"",v); gsub(/^[ \t]+|[ \t]+$/,"",p); gsub(/^[ \t]+|[ \t]+$/,"",s); if (v=="") v="0"; if (p=="") p="0"; if (s=="") s="0"; printf "%s.%s.%s", v, p, s}' Makefile)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text=☢️ *Kernel Build Started!*
            *Device:* Blossom
            *Version:* non-ksu
            *Arch:* arm64
            *Defconfig:* $DEFCONFIG
            *Kernel Version:* $VERSION
            *Commit:* [${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})" \
            -d parse_mode=Markdown

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev \
            lld llvm gcc g++ python2 ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          sudo ln -sf "/usr/bin/python2" /usr/bin/python
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang
          git clone --depth=1 https://github.com/Sakurajima07/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/Sakurajima07/arm-linux-androideabi-4.9 gcc

      - name: Build the kernel and log output
        run: |
          mkdir -p out
          START=$(date +%s)
          export ARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc/bin:$PATH"
          
          # Фикс ворнингов (команды в одну строку)
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/-implicit-function-declaration//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/=return-type//g' {} +
          find . -name "Makefile*" -type f -exec sed -i 's/=unknown-warning-option//g' {} +
          
          make O=out ${DEFCONFIG}_defconfig
          sed -i 's/CONFIG_FRAME_WARN=[0-9]*/CONFIG_FRAME_WARN=8192/g' out/.config
          
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CROSS_COMPILE=aarch64-linux-android- \
            KBUILD_WERROR=0 2>&1 | tee build.log || (echo "❌ СБОРКА УПАЛА" && exit 1)
            
          echo "BUILD_TIME=$(($(date +%s) - START))" >> $GITHUB_ENV

      - name: Set build info (time, md5)
        run: |
          IMAGE_PATH=$(find out/arch/arm64/boot -name "Image.gz" | head -n 1)
          if [ -f "$IMAGE_PATH" ]; then
            echo "IMAGE_FOUND=$IMAGE_PATH" >> $GITHUB_ENV
            echo "MD5_CHECKSUM=$(md5sum "$IMAGE_PATH" | cut -d ' ' -f1)" >> $GITHUB_ENV
            echo "✅ Ядро найдено: $IMAGE_PATH"
          else
            echo "❌ Ядро НЕ НАЙДЕНО!"
            exit 1
          fi

      - name: Create AnyKernel3 Zip
        if: success()
        run: |
          git clone --depth=1 https://github.com/LineXin/AnyKernel3_blossom ak3
          cp ${{ env.IMAGE_FOUND }} ak3/Image.gz
          cd ak3
          # Твои правки в anykernel.sh (если нужно)
          sed -i 's/device.name1=angelican/device.name1=blossom/g' anykernel.sh
          zip -r9 ../VoidLine-KernelRebirth-non-ksuBlossom.zip * -x .git* README.md
          cd ..
          echo "ZIP_MD5=$(md5sum VoidLine-KernelRebirth-non-ksuBlossom.zip.zip | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: Notify success on Telegram
        if: success()
        run: |
          curl -s -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@VoidLine-KernelRebirth-non-ksuBlossom.zip.zip \
            -F caption="✅ *Build Successful!*
            ⏱ *Time:* ${{ env.BUILD_TIME }}s
            🔐 *MD5:* \`${{ env.ZIP_MD5 }}\`
            📱 *Device:* Blossom" \
            -F parse_mode=Markdown \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: Notify failure or Send Log
        if: always()
        run: |
          if [ ! -f VoidLine-Kernel-Blossom.zip ]; then
            curl -s -F document=@build.log \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&caption=❌ Build Failed. Check log."
          fi
