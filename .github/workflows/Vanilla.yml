name: VoidLine Kernel Rebirth non-ksu blossom

on:
  workflow_dispatch:

env:
  DEFCONFIG: blossom

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 📥 Clone kernel
        run: |
          git clone --depth=1 https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom source

      - name: ⚙️ Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git bc bison flex build-essential \
            libssl-dev libelf-dev \
            clang lld llvm make python2 zip curl

          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: 🔧 Clone clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: 🛠️ Build kernel (FIXED)
        run: |
          set -e

          cd source

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          echo "👉 Defconfig"
          make blossom_defconfig

          echo "👉 Build start"
          make -j$(nproc --all) \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            2>&1 | tee build.log

      - name: 🔍 Find kernel image
        run: |
          echo "Searching kernel..."

          IMAGE=$(find source -type f -name "Image*" | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "❌ Kernel не собрался"
            echo "------ LOG ------"
            tail -n 50 source/build.log || true
            exit 1
          fi

          echo "✅ Found: $IMAGE"
          echo "IMAGE_PATH=$IMAGE" >> $GITHUB_ENV

      - name: 📦 Make ZIP
        run: |
          git clone --depth=1 https://github.com/MrGadget84/AnyKernel3_blossom ak3

          cp "${{ env.IMAGE_PATH }}" ak3/Image.gz

          cd ak3

          # 🔥 УБРАТЬ ВСЁ СТАРОЕ
          sed -i '/ui_print/d' anykernel.sh

          # 🔥 ЧИСТЫЙ БАННЕР
          sed -i '1i\
          ui_print "==============================";\
          ui_print " VoidLine Kernel Rebirth";\
          ui_print "   non-ksu blossom";\
          ui_print "------------------------------";\
          ui_print " Built by LineXin";\
          ui_print "==============================";\
          ui_print " ";' anykernel.sh

          ZIP_NAME="VoidLine_Kernel_Rebirth-non-ksu-blossom.zip"
          zip -r9 ../$ZIP_NAME *

          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: ⬆️ Upload
        uses: actions/upload-artifact@v4
        with:
          name: VoidLine_Kernel_Rebirth-non-ksu-blossom
          path: ${{ env.ZIP_NAME }}
