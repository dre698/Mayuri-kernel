name: Mayuri Kernel Production CI (Stable+)

on:
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: blossom_defconfig
  KERNEL_ARCH: arm64
  KBUILD_BUILD_USER: dre698
  KBUILD_BUILD_HOST: github-actions

  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache

  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
  GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex build-essential git zip curl wget ccache \
          libssl-dev libelf-dev cpio kmod jq

    - name: Setup ccache
      run: |
        ccache --max-size=2G
        ccache -z

    - name: Clang toolchain
      run: |
        git clone --depth=1 \
          https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r428724.git \
          /tmp/clang

    - name: Setup environment (SAFE CLANG ONLY)
      run: |
        echo "ARCH=${KERNEL_ARCH}" >> $GITHUB_ENV
        echo "SUBARCH=${KERNEL_ARCH}" >> $GITHUB_ENV

        echo "CC=clang" >> $GITHUB_ENV
        echo "CROSS_COMPILE=" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

        echo "PATH=/tmp/clang/bin:$PATH" >> $GITHUB_ENV

    - name: Auto Device Detect
      run: |
        DEVICE=$(grep -Ril "blossom\|mt" arch/arm64/boot/dts | head -n 1 | xargs basename | sed 's/.dts//')
        [ -z "$DEVICE" ] && DEVICE="blossom"
        echo "DEVICE_TREE=$DEVICE" >> $GITHUB_ENV
        echo "Detected: $DEVICE"

    - name: Telegram Init
      run: |
        RESP=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d chat_id="${PRIVATE_CHAT_ID}" \
          -d text="🚀 Mayuri Kernel CI started (Stable+)")

        echo "TG_MSG_ID=$(echo $RESP | jq -r '.result.message_id')" >> $GITHUB_ENV

    - name: Clean source
      run: make mrproper || true

    - name: Configure kernel
      run: |
        mkdir -p out
        make O=out ARCH=$ARCH $KERNEL_DEFCONFIG
        make O=out ARCH=$ARCH olddefconfig

    - name: KernelSU Integration (SAFE FALLBACK)
      run: |
        rm -rf KernelSU

        if git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU; then
          echo "KSU=Next"
        elif git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU; then
          echo "KSU=ReSukiSU"
        else
          git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU || true
        fi

        bash KernelSU/kernel/setup.sh legacy || true

    - name: Build kernel (retry x2)
      run: |
        build() {
          START=$(date +%s)

          make -j$(nproc) O=out ARCH=$ARCH \
            CC=clang \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            2>&1 | tee build.log

          echo "B_TIME=$(($(date +%s)-START))" >> $GITHUB_ENV
        }

        build || build

    - name: Detect Image
      run: |
        if [ -f out/arch/$ARCH/boot/Image.gz-dtb ]; then
          echo "KERNEL_IMAGE=Image.gz-dtb" >> $GITHUB_ENV
        elif [ -f out/arch/$ARCH/boot/Image.gz ]; then
          echo "KERNEL_IMAGE=Image.gz" >> $GITHUB_ENV
        else
          echo "KERNEL_IMAGE=Image" >> $GITHUB_ENV
        fi

    - name: Artifact name
      run: |
        DATE=$(date +%y%m%d)
        TIME=$(date +%H%M)
        
        echo "ARTIFACT_NAME=Mayuri-${DEVICE_TREE}-ksn${KSU_VERSION}-${DATE}-${TIME}-${GITHUB_SHA::9}" >> $GITHUB_ENV
        
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
        cp out/arch/$ARCH/boot/$KERNEL_IMAGE anykernel/
        cd anykernel
        zip -r9 ../${ARTIFACT_NAME}.zip . -x "*.git*" "*README*"

    - name: Hash
      run: |
        echo "Z_MD5=$(md5sum ${ARTIFACT_NAME}.zip | awk '{print $1}')" >> $GITHUB_ENV
        echo "Z_SHA256=$(sha256sum ${ARTIFACT_NAME}.zip | awk '{print $1}')" >> $GITHUB_ENV

    - name: Telegram Send
      if: always()
      run: |
        set +e

        B_MIN=$((B_TIME / 60))
        B_SEC=$((B_TIME % 60))

        KSU_VERSION=${KSU_VERSION:-unknown}
        KSU_TAG=${KSU_TAG:-unknown}

        if [ "${{ job.status }}" = "success" ]; then

          CAPTION=$(printf "✅ Mayuri Kernel\n\nDevice: %s\nBuild: %sm %ss\nBranch: %s\nCommit: %s\n\nKSU: %s (%s)\n\nMD5: %s\nSHA256: %s" \
            "$DEVICE_TREE" "$B_MIN" "$B_SEC" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" \
            "$KSU_VERSION" "$KSU_TAG" "$Z_MD5" "$Z_SHA256")

          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"; do
            curl -s -F chat_id="$CHAT" \
              -F document=@"${ARTIFACT_NAME}.zip" \
              -F caption="$CAPTION" \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done

        else
          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"; do
            curl -s -F chat_id="$CHAT" \
              -F document=@build.log \
              -F caption="❌ Mayuri Kernel failed\nDevice: $DEVICE_TREE\nCommit: ${GITHUB_SHA::7}" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done
        fi

    - name: Summary
      if: always()
      run: |
        {
          echo "# Mayuri Kernel (Stable+)"
          echo "| Status | ${{ job.status }} |"
          echo "| Device | ${DEVICE_TREE} |"
          echo "| Commit | ${GITHUB_SHA::7} |"
          echo "| Build time | ${B_TIME}s |"
          echo "| Artifact | ${ARTIFACT_NAME}.zip |"
        } >> $GITHUB_STEP_SUMMARY

    - name: Cleanup
      if: always()
      run: |
        ccache -s || true
