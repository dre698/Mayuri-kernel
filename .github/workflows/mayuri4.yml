name: Mayuri Kernel Production CI (Stable+)

on:
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: blossom_defconfig
  KERNEL_ARCH: arm64
  KBUILD_BUILD_USER: dre698
  KBUILD_BUILD_HOST: github-actions

  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache

  BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
  GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # ==========================================================
    # Checkout
    # ==========================================================

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # ==========================================================
    # Dependencies
    # ==========================================================

    - name: Install dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          bc \
          bison \
          flex \
          build-essential \
          git \
          zip \
          curl \
          wget \
          jq \
          ccache \
          libssl-dev \
          libelf-dev \
          cpio \
          kmod

    # ==========================================================
    # ccache
    # ==========================================================

    - name: Setup ccache
      run: |
        mkdir -p "$CCACHE_DIR"

        ccache --set-config=cache_dir="$CCACHE_DIR"
        ccache --max-size=2G
        ccache --zero-stats

    # ==========================================================
    # Clang
    # ==========================================================

    - name: Download Clang
      run: |
        git clone --depth=1 \
          https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r428724.git \
          /tmp/clang
          
    - name: Verify Clang Installation
      run: |
        ls -lah /tmp/clang/bin
        file /tmp/clang/bin/clang
        /tmp/clang/bin/clang --version

    # ==========================================================
    # Environment
    # ==========================================================

    - name: Setup build environment
      run: |
        echo "ARCH=${KERNEL_ARCH}" >> $GITHUB_ENV
        echo "SUBARCH=${KERNEL_ARCH}" >> $GITHUB_ENV

        echo "CC=/tmp/clang/bin/clang" >> $GITHUB_ENV

        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

        echo "CROSS_COMPILE=" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=" >> $GITHUB_ENV

        echo "/tmp/clang/bin" >> $GITHUB_PATH

    # ==========================================================
    # Auto Device Detect
    # ==========================================================

    - name: Detect Device
      run: |

        DEVICE="blossom"

        if grep -q "^CONFIG_ARCH_MT6765=y" arch/arm64/configs/${KERNEL_DEFCONFIG}; then
          DEVICE="blossom"
        fi

        echo "DEVICE_TREE=$DEVICE" >> $GITHUB_ENV

        echo "Detected device : $DEVICE"

    # ==========================================================
    # Telegram Init
    # ==========================================================

    - name: Telegram Init
      run: |

        RESP=$(curl -s \
          -X POST \
          "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d chat_id="${PRIVATE_CHAT_ID}" \
          -d text="🚀 Mayuri Kernel CI Started (Stable+)")

        echo "TG_MSG_ID=$(echo "$RESP" | jq -r '.result.message_id')" >> $GITHUB_ENV

    - name: Telegram Progress
      run: |
        curl -s \
          -X POST \
          "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
          -d chat_id="${PRIVATE_CHAT_ID}" \
          -d message_id="${TG_MSG_ID}" \
          -d text="⚙️ Preparing build environment..."
          
    # ==========================================================
    # KernelSU
    # ==========================================================

    - name: Clone KernelSU-Next
      run: |
        rm -rf KernelSU KernelSU-Next

        git clone --depth=1 \
          https://github.com/KernelSU-Next/KernelSU-Next.git \
          KernelSU

    - name: Detect KernelSU Version
      run: |
        cd KernelSU

        COUNT=$(git rev-list --count HEAD)
        TAG=$(git describe --tags --always)

        KSU_VERSION=$((30000 + COUNT))

        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_TAG=$TAG" >> $GITHUB_ENV

        echo "KernelSU Version : $KSU_VERSION"
        echo "KernelSU Tag     : $KSU_TAG"

    - name: Integrate KernelSU
      run: |
        bash KernelSU/kernel/setup.sh legacy

    # ==========================================================
    # Clean
    # ==========================================================

    - name: Clean source
      run: |
        make mrproper || true

        mkdir -p out

    # ==========================================================
    # Configure
    # ==========================================================

    - name: Configure kernel
      run: |
        make \
          O=out \
          ARCH=$ARCH \
          $KERNEL_DEFCONFIG

        make \
          O=out \
          ARCH=$ARCH \
          olddefconfig
          
    - name: Check Compiler Config
      run: |
        grep -E "CONFIG_CC_IS_CLANG|CONFIG_GCC_VERSION|CONFIG_CLANG_VERSION|CONFIG_LTO" out/.config || true
    
    - name: Check LLVM Config
      run: |
        grep -E "CONFIG_LTO|CONFIG_CC_IS_CLANG|CONFIG_CC_CAN_LINK|CONFIG_CLANG_VERSION" out/.config || true

    # ==========================================================
    # Build
    # ==========================================================
    
    - name: Verify Clang
      run: |
        echo "PATH=$PATH"
        echo

        echo "which clang:"
        which clang
        echo

        echo "clang version:"
        clang --version
        echo

        echo "ccache:"
        ccache --version
        
    - name: Debug Compiler
      run: |
        echo "===== PATH ====="
        echo "$PATH"

        echo
        echo "===== WHICH ====="
        which clang
        which gcc || true
        which clang-13 || true

        echo
        echo "===== VERSIONS ====="
        clang --version
        /tmp/clang/bin/clang --version
        gcc --version || true
        
    - name: Check Makefile Compiler
      run: |
        grep -n "HOSTCC" Makefile
        grep -n "CC =" Makefile || true

    - name: Build kernel (Retry x2)
      run: |
        build_kernel() {
          set -o pipefail
        
          START=$(date +%s)

          echo "========== COMPILER =========="
          which clang
          clang --version | head -1
          echo
          
          echo "===== ENV ====="
          echo "CC=$CC"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTCXX=$HOSTCXX"
          echo "LLVM=$LLVM"
          echo "LLVM_IAS=$LLVM_IAS"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "HOSTLD=$HOSTLD"
          
          echo
          echo "===== FULL ENV ====="
          env | sort
          
          echo
          echo "===== LLVM ENV ====="
          printenv | grep LLVM || true
          printenv | grep CLANG || true

          echo
          echo "===== GCC ====="
          gcc -v

          echo
          echo "===== G++ ====="
          g++ -v
          
          echo
          echo "===== BINUTILS ====="
          ld --version | head -1
          as --version | head -1
          
          echo
          echo "===== MAKE VARIABLES ====="
          make O=out ARCH=$ARCH kernelversion
          make O=out ARCH=$ARCH -pn | grep "^HOSTCC =" | head -1
          make O=out ARCH=$ARCH -pn | grep "^CC =" | head -1
          
          echo
          echo "===== BUILD ====="
          set -x
          
          echo
          echo "===== KBUILD COMPILER ====="
          cat out/include/generated/compile.h 2>/dev/null || true
          
          echo
          echo "===== KERNEL CONFIG ====="
          grep -E "CONFIG_CC_IS_CLANG|CONFIG_CLANG_VERSION|CONFIG_GCC_VERSION|CONFIG_LTO|CONFIG_LD_IS_LLD|CONFIG_AS_IS_LLVM" out/.config || true

          make V=1 -j"$(nproc)" \
            O=out \
            ARCH=$ARCH \
            CC=/tmp/clang/bin/clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            LLVM=1 \
            LLVM_IAS=1 \
            KBUILD_BUILD_USER=$KBUILD_BUILD_USER \
            KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST \
            2>&1 | tee build.log

          BUILD_RESULT=${PIPESTATUS[0]}

          END=$(date +%s)

          echo "B_TIME=$((END-START))" >> $GITHUB_ENV

          return $BUILD_RESULT
        }

        echo "========== BUILD ATTEMPT #1 =========="

        build_kernel || {
            echo "First build failed, retrying..."
            sleep 5
            build_kernel || exit 1
        }
      
    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn
        
    - name: Upload Config
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-config
        path: out/.config
        if-no-files-found: warn
   
    # ==========================================================
    # Detect Kernel Image
    # ==========================================================

    - name: Detect Image
      run: |
        IMAGE_DIR="out/arch/$ARCH/boot"

        if [ -f "$IMAGE_DIR/Image.gz-dtb" ]; then
          IMAGE="Image.gz-dtb"
        elif [ -f "$IMAGE_DIR/Image.gz" ]; then
          IMAGE="Image.gz"
        elif [ -f "$IMAGE_DIR/Image" ]; then
          IMAGE="Image"
        else
          echo "::error::Kernel image not found"
          exit 1
        fi

        echo "KERNEL_IMAGE=$IMAGE" >> $GITHUB_ENV

        echo "Kernel image : $IMAGE"

    # ==========================================================
    # Build Statistics
    # ==========================================================

    - name: Build Statistics
      if: always()
      run: |
        echo "========== BUILD STATS =========="

        ccache -s || true

        echo
        echo "Compiler:"
        clang --version | head -1

        echo
        echo "CPU:"
        nproc
        
    # ==========================================================
    # Artifact Name
    # ==========================================================

    - name: Artifact name
      run: |
        DATE=$(date +%y%m%d)
        TIME=$(date +%H%M)

        echo "ARTIFACT_NAME=Mayuri-${DEVICE_TREE}-ksn${KSU_VERSION}-${DATE}-${TIME}-${GITHUB_SHA::9}" >> $GITHUB_ENV

        echo "Artifact : Mayuri-${DEVICE_TREE}-ksn${KSU_VERSION}-${DATE}-${TIME}-${GITHUB_SHA::9}.zip"

    # ==========================================================
    # Package AnyKernel3
    # ==========================================================

    - name: Package AnyKernel3
      run: |
        rm -rf anykernel

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

        cp out/arch/$ARCH/boot/$KERNEL_IMAGE anykernel/

        cd anykernel

        zip -r9 "../${ARTIFACT_NAME}.zip" . \
          -x "*.git*" \
          -x "*README*" \
          -x "*.github*"

        cd ..

        ls -lh "${ARTIFACT_NAME}.zip"

    # ==========================================================
    # Checksums
    # ==========================================================

    - name: Generate Hash
      run: |
        MD5=$(md5sum "${ARTIFACT_NAME}.zip" | awk '{print $1}')
        SHA256=$(sha256sum "${ARTIFACT_NAME}.zip" | awk '{print $1}')

        echo "Z_MD5=$MD5" >> $GITHUB_ENV
        echo "Z_SHA256=$SHA256" >> $GITHUB_ENV

        echo "MD5    : $MD5"
        echo "SHA256 : $SHA256"

    # ==========================================================
    # Upload Artifact
    # ==========================================================

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.ARTIFACT_NAME }}.zip
        compression-level: 0
        
    # ==========================================================
    # Telegram Progress
    # ==========================================================

    - name: Telegram Progress (Packaging)
      if: success()
      run: |
        curl -s \
          -X POST \
          "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
          -d chat_id="${PRIVATE_CHAT_ID}" \
          -d message_id="${TG_MSG_ID}" \
          -d text="📦 Packaging kernel..."

    - name: Telegram Send
      if: always()
      run: |
        set +e

        B_TIME=${B_TIME:-0}
        B_MIN=$((B_TIME / 60))
        B_SEC=$((B_TIME % 60))

        COMPILER=$(/tmp/clang/bin/clang --version | head -1)

        KSU_VERSION=${KSU_VERSION:-unknown}
        KSU_TAG=${KSU_TAG:-unknown}

        if [ "${{ job.status }}" = "success" ]; then

          CAPTION=$(printf "✅ *Mayuri Kernel*\n\n📱 Device : %s\n⏱ Build : %sm %ss\n🌿 Branch : \`%s\`\n🔨 Commit : \`%s\`\n\n⚙️ Compiler :\n\`%s\`\n\n🔐 KernelSU :\n\`%s (%s)\`\n\n📦 MD5 :\n\`%s\`\n\n🔎 SHA256 :\n\`%s\`" "$DEVICE_TREE" "$B_MIN" "$B_SEC" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$COMPILER" "$KSU_VERSION" "$KSU_TAG" "$Z_MD5" "$Z_SHA256")

          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"
          do
            curl -s \
              --retry 3 \
              --retry-delay 2 \
              -F chat_id="$CHAT" \
              -F document=@"${ARTIFACT_NAME}.zip" \
              -F caption="$CAPTION" \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done

          curl -s \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
            -d chat_id="${PRIVATE_CHAT_ID}" \
            -d message_id="${TG_MSG_ID}" \
            -d text="✅ Build finished successfully."

        else

          FAIL_CAPTION=$(printf "❌ *Mayuri Kernel Build Failed*\n\n📱 Device : %s\n🌿 Branch : \`%s\`\n🔨 Commit : \`%s\`\n\n📄 build.log attached." "$DEVICE_TREE" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}")

          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"
          do
            curl -s \
              --retry 3 \
              --retry-delay 2 \
              -F chat_id="$CHAT" \
              -F document=@build.log \
              -F caption="$FAIL_CAPTION" \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done

          curl -s \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
            -d chat_id="${PRIVATE_CHAT_ID}" \
            -d message_id="${TG_MSG_ID}" \
            -d text="❌ Build failed."
        fi
        
    # ==========================================================
    # GitHub Summary
    # ==========================================================

    - name: Build Summary
      if: always()
      run: |
        COMPILER=$(/tmp/clang/bin/clang --version | head -1)

        {
          echo "# ======================================================================"
          echo "# PROJECT : Mayuri Kernel"
          echo "# DEVICE  : ${DEVICE_TREE}"
          echo "# STATUS  : ${{ job.status }}"
          echo "# ======================================================================"
          echo

          echo "## Build Information"
          echo
          echo "| Key | Value |"
          echo "|-----|-------|"
          echo "| Device | ${DEVICE_TREE} |"
          echo "| Branch | ${GITHUB_REF_NAME} |"
          echo "| Commit | ${GITHUB_SHA::7} |"
          echo "| Compiler | ${COMPILER} |"
          echo "| KernelSU | ${KSU_VERSION:-unknown} (${KSU_TAG:-unknown}) |"
          echo "| Build Time | ${B_TIME:-0}s |"

          if [ "${{ job.status }}" = "success" ]; then
            echo "| MD5 | ${Z_MD5} |"
            echo "| SHA256 | ${Z_SHA256} |"
            echo "| Artifact | ${ARTIFACT_NAME}.zip |"
          fi

          echo
          echo "## ccache Statistics"
          echo
          echo '```'
          ccache -s || true
          echo '```'

          echo
          echo "======================================================================"
        } >> "$GITHUB_STEP_SUMMARY"

    # ==========================================================
    # Cleanup
    # ==========================================================

    - name: Cleanup
      if: always()
      run: |
        rm -rf anykernel KernelSU

        ccache -s || true

        echo "Cleanup finished."
