name: Mayuri Kernel CI (Stable V2)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: blossom_defconfig
      KBUILD_BUILD_USER: dre698
      KBUILD_BUILD_HOST: github-actions

      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      PRIVATE_CHAT_ID: ${{ secrets.PRIVATE_CHAT_ID }}
      GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git curl zip bc bison flex libssl-dev make python3 ccache

    - name: Setup Clang
      run: |
        curl -L https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/latest/download/clang-r547379.tar.gz \
        | tar -xz -C $HOME

        echo "$HOME/clang/bin" >> $GITHUB_PATH

        echo "CC=clang" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: Fix build flags
      run: |
        echo "KBUILD_CFLAGS=-O2 -march=armv8-a" >> $GITHUB_ENV

    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          out
        key: kernel-${{ github.sha }}

    - name: Configure kernel
      run: |
        mkdir -p out

        make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG} < /dev/null
        make O=out ARCH=${ARCH} olddefconfig < /dev/null

    - name: Build kernel (retry)
      run: |
        set +e

        for i in 1 2 3; do
          echo "Build attempt $i"

          make -j$(nproc) O=out ARCH=${ARCH} CC=clang CLANG_TRIPLE=aarch64-linux-gnu- Image.gz dtbs

          if [ $? -eq 0 ]; then
            echo "BUILD_OK=1" >> $GITHUB_ENV
            break
          fi

          sleep 10
        done

        set -e

    - name: Validate output
      run: |
        test -f out/arch/arm64/boot/Image.gz || {
          echo "ERROR: Image.gz not found"
          find out -name Image*
          exit 1
        }

    - name: Pack AnyKernel
      if: success()
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

        cp out/arch/arm64/boot/Image.gz anykernel/

        cd anykernel
        zip -r9 ../${ARTIFACT_NAME}.zip . -x "*.git*" "*README*"

    - name: Generate hashes
      run: |
        Z_MD5=$(md5sum ${ARTIFACT_NAME}.zip | awk '{print $1}')
        Z_SHA256=$(sha256sum ${ARTIFACT_NAME}.zip | awk '{print $1}')

        echo "Z_MD5=$Z_MD5" >> $GITHUB_ENV
        echo "Z_SHA256=$Z_SHA256" >> $GITHUB_ENV

    - name: Telegram notify
      if: always()
      run: |
        set +e

        B_MIN=$((B_TIME / 60))
        B_SEC=$((B_TIME % 60))

        if [ "${{ job.status }}" = "success" ]; then

          CAPTION=$(printf "✅ Mayuri Kernel\nDevice: %s\nBuild: %sm %ss\nBranch: %s\nCommit: %s\nKSU: %s (%s)\n\nMD5: \\`%s\\`\nSHA256: \\`%s\\`" \
            "$DEVICE_TREE" "$B_MIN" "$B_SEC" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$KSU_VERSION" "$KSU_TAG" "$Z_MD5" "$Z_SHA256")

          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"; do
            curl -s -F chat_id="$CHAT" \
              -F document=@"${ARTIFACT_NAME}.zip" \
              -F caption="$CAPTION" \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done

        else

          FAIL=$(printf "❌ Mayuri Kernel FAILED\nDevice: %s\nBuild: %sm %ss\nBranch: %s\nCommit: %s\n\nCheck build.log" \
            "$DEVICE_TREE" "$B_MIN" "$B_SEC" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}")

          for CHAT in "$PRIVATE_CHAT_ID" "$GROUP_CHAT_ID"; do
            curl -s -F chat_id="$CHAT" \
              -F document=@build.log \
              -F caption="$FAIL" \
              -F parse_mode=Markdown \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          done

        fi

    - name: Summary
      if: always()
      run: |
        {
          echo "# Mayuri Kernel Stable V2"
          echo ""
          echo "| Status | ${{ job.status }} |"
          echo "| Device | ${DEVICE_TREE} |"
          echo "| Branch | ${GITHUB_REF_NAME} |"
          echo "| Commit | ${GITHUB_SHA::7} |"
          echo "| MD5 | ${Z_MD5} |"
          echo "| SHA256 | ${Z_SHA256} |"
        } >> $GITHUB_STEP_SUMMARY
